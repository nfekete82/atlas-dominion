services:
  sandforge-bastion-wars:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:8095"

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8095/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      start_period: 5s
      retries: 12
