name: Verify Humvee wheel motion and infantry defensive halt
on:
  push:
    branches: [feat/rover-realistic-tires-flag-20261027]
    paths:
      - .github/workflows/verify-humvee-defense.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combat-and-render-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Compile project
        run: npm run build
      - name: Unit combat, movement, saved orders, and animated Humvee validation
        run: |
          node --test \
            tests/reborn.test.mjs \
            tests/reborn-stop-to-defend.test.mjs \
            tests/reborn-humvee.test.mjs \
            tests/reborn-animation.test.mjs \
            tests/reborn-combined-arms.test.mjs \
            tests/reborn-premium-legionnaire.test.mjs
