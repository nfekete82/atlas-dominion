name: Sandforge measured mission escape A/B
on:
  push:
    branches: [feat/sandforge-measured-mission-escape-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-measured-mission-escape.test.mjs tests/sandforge-ai-tournament.test.mjs tests/reborn-commander.test.mjs tests/reborn-combat-missions.test.mjs
  league:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        opponent: [guarded, pressure, expansion, armored]
        cohort: [known, heldout, virgin]
        include:
          - cohort: known
            seeds: '2026,2027,2028,2029'
          - cohort: heldout
            seeds: '2054,2055,2056,2057'
          - cohort: virgin
            seeds: '2058,2059,2060,2061'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Paid equal-state A/B; real wins versus timeouts
        run: node scripts/ai-strategy-tournament.mjs --opponents "${{ matrix.opponent }}" --seeds "${{ matrix.seeds }}" --seconds 360 --contenders current,early-barracks,measured-escape --output ai-arena-results/escape-${{ matrix.opponent }}-${{ matrix.cohort }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: escape-${{ matrix.opponent }}-${{ matrix.cohort }}
          path: ai-arena-results/escape-${{ matrix.opponent }}-${{ matrix.cohort }}.json
          retention-days: 21
