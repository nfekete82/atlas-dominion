name: Sandforge engineer squad escort
on:
  push:
    branches:
      - feat/sandforge-engineer-squad-escort-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  squad-escort:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-engineer-squad-escort.test.mjs tests/sandforge-engineer-sequential-orders.test.mjs tests/reborn-control-retreat.test.mjs tests/reborn-support.test.mjs
