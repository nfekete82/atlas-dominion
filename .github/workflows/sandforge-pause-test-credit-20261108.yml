name: Sandforge tactical pause test credit

on:
  push:
    branches:
      - feat/webgl-pause-iddqd-credits-20261108
  pull_request:
    branches:
      - fix/webgl-airlift-scale-bomber-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pause-code:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build complete WebGL game
        run: npm run build
      - name: Keyboard, pause scoping, credit and HUD regression
        run: node --test tests/webgl-pause-iddqd-credits.test.mjs

  node-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  browser-pause-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      ATLAS_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          npm ci --no-audit --no-fund
          npm ci --prefix tests/browser --no-audit --no-fund
          cd tests/browser
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: Actual pause-dialog keyboard input in Chromium
        run: |
          set -euo pipefail
          PORT=8155 HOST=127.0.0.1 node scripts/serve.mjs >/tmp/sandforge-pause-cheat.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8155/healthz >/dev/null 2>&1; then READY=1; break; fi
            sleep .25
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/sandforge-pause-cheat.log; exit 1; fi
          ATLAS_BASE_URL=http://127.0.0.1:8155 \
            tests/browser/node_modules/.bin/playwright test \
            --config=tests/browser/playwright.config.mjs \
            tests/browser/webgl-pause-iddqd-credits.spec.mjs \
            --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sandforge-pause-iddqd-chromium
          path: tests/browser/artifacts/
          if-no-files-found: ignore
          retention-days: 7
