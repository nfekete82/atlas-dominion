name: Bake and validate visibly upgraded PBR buildings

on:
  push:
    branches: [feat/pbr-buildings-overhaul-20261027-144413]
    paths:
      - scripts/animation/building-details.js
      - scripts/animation/building-pbr.js
      - scripts/animation/building-export.js
      - scripts/animation/offline-building-export.mjs
      - scripts/build.mjs
      - src/reborn/building-presentation.ts
      - .github/workflows/building-visible-art.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: building-visible-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install JS dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix tests/browser --no-audit --no-fund
      - name: Bake all PBR models and actual runtime sprites
        run: node scripts/export-atlas-buildings.mjs --cpu
      - name: Validate GLBs, sprites, gameplay and fingerprinted build
        run: |
          npm run build
          npm run assets:buildings:validate
          node --test tests/reborn-building-pbr.test.mjs tests/reborn-building-rigs.test.mjs tests/reborn-buildings.test.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const version=JSON.parse(fs.readFileSync('dist/building-art-version.json','utf8'));
          assert.equal(version.revision,'pbr-strong-20261027');
          for(const [kind,hash] of Object.entries(version.files)){
            const bytes=fs.readFileSync('dist/src/assets/reborn/buildings-3d/'+kind+'-0.png');
            assert.equal(createHash('sha256').update(bytes).digest('hex'),hash);
          }
          JS
      - name: Install Chromium
        run: cd tests/browser && npx playwright install --with-deps chromium
      - name: Verify real browser renders both factions
        env:
          ATLAS_BROWSER_CHANNEL: chromium
        run: npm --prefix tests/browser test -- --grep "buildings PBR"
      - name: Publish freshly baked GLBs and game sprites
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/reborn/buildings-3d/
          git add src/reborn/turret-rig.ts
          if git diff --cached --quiet; then
            echo 'Artifacts unchanged'
            exit 0
          fi
          git commit -m 'assets(buildings): bake high-contrast armored structures for gameplay'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
