name: Sandforge threat-gated defense A/B
on:
  push:
    branches: [feat/sandforge-threat-gated-defense-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-ai-tournament.test.mjs tests/sandforge-four-bastion-postmortem.test.mjs tests/reborn-combat-missions.test.mjs tests/reborn-commander.test.mjs
  league:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        opponent: [guarded, pressure, expansion, armored]
        cohort: [known, holdout, unseen]
        include:
          - cohort: known
            seeds: '2026,2027,2028,2029'
          - cohort: holdout
            seeds: '2030,2031,2032,2033'
          - cohort: unseen
            seeds: '2046,2047,2048,2049'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Four-way equal-state paid A/B
        run: node scripts/ai-strategy-tournament.mjs --opponents "${{ matrix.opponent }}" --seeds "${{ matrix.seeds }}" --seconds 360 --contenders current,early-barracks,adaptive-contact,threat-guard --output ai-arena-results/guard-${{ matrix.opponent }}-${{ matrix.cohort }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-${{ matrix.opponent }}-${{ matrix.cohort }}
          path: ai-arena-results/guard-${{ matrix.opponent }}-${{ matrix.cohort }}.json
          retention-days: 21
