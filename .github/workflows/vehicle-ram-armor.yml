name: Vehicle trampling and tank armor regression
on:
  push:
    branches: [feat/vehicle-trample-tank-armor-20261027]
    paths:
      - src/reborn/catalog.ts
      - src/reborn/simulation.ts
      - tests/reborn-vehicle-ram-armor.test.mjs
      - .github/workflows/vehicle-ram-armor.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build, TypeScript checks, trampling and combat regressions
        run: |
          npm run build
          node --test tests/reborn-vehicle-ram-armor.test.mjs tests/reborn-campaign.test.mjs tests/reborn-humvee.test.mjs
