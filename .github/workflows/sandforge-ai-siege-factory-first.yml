name: Sandforge AI factory-first siege priority
on:
  push:
    branches:
      - feat/sandforge-ai-observed-siege-factory-first-20261102
permissions:
  contents: read
jobs:
  economy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-ai-siege-factory-first.test.mjs tests/reborn-tactical-ai-49-early-artillery.test.mjs tests/reborn-tactical-ai-42-siege.test.mjs tests/reborn-tactical-ai-40.test.mjs
