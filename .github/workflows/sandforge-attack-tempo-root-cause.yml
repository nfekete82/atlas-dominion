name: Sandforge detailed attack tempo root-cause audit
on:
  push:
    branches: [diag/sandforge-attack-tempo-timeline-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-attack-tempo-audit.test.mjs tests/sandforge-ai-tournament.test.mjs tests/reborn-commander.test.mjs
  tempo:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        opponent: [guarded, pressure, expansion, armored]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Run real paid 900s full-game tempo profiles
        run: node scripts/ai-attack-tempo-audit.mjs --opponent "${{ matrix.opponent }}" --seeds 2026,2029,2074,2075 --seconds 900 --output ai-arena-results/attack-tempo-${{ matrix.opponent }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attack-tempo-${{ matrix.opponent }}
          path: ai-arena-results/attack-tempo-${{ matrix.opponent }}.json
          retention-days: 21
