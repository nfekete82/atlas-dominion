name: Sandforge read-only strategic operation shadow
on:
  push:
    branches: [feat/sandforge-operations-shadow-evaluation-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-operation-shadow.test.mjs tests/sandforge-ai-tournament.test.mjs tests/reborn-commander.test.mjs
  census:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        opponent: [guarded, pressure, expansion, armored]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Observe proposed intent without changing actual combat
        run: node scripts/ai-operations-shadow.mjs --opponent "${{ matrix.opponent }}" --seeds 2026,2029,2062,2066 --seconds 360 --output ai-arena-results/operation-shadow-${{ matrix.opponent }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operation-shadow-${{ matrix.opponent }}
          path: ai-arena-results/operation-shadow-${{ matrix.opponent }}.json
          retention-days: 21
