name: Temporary legacy map fingerprint cross-platform diagnostics
on:
  push:
    branches: [fix/sandforge-legacy-save-footprint-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fingerprints:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Print all legacy map hashes after rounding geometry to 6 decimal places
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {Simulation} from './dist/src/reborn/simulation.js';
          const baselines=JSON.parse(readFileSync('tests/fixtures/reborn-legacy-maps.json','utf8'));
          for(const {version,seed,hash} of baselines){
            const g=new Simulation(seed,version);
            const geometry={generated:g.world.generated,blocked:Array.from(g.world.blocked),territories:g.territories,bases:g.bases,units:g.units.filter(u=>u.kind==='infantry')};
            const raw=createHash('sha256').update(JSON.stringify(geometry)).digest('hex');
            const rounded=JSON.stringify(geometry,(_,v)=>typeof v==='number'&&Number.isFinite(v)?Math.round(v*1000000)/1000000:v);
            const canonical=createHash('sha256').update(rounded).digest('hex');
            console.log('MAP_FINGERPRINT '+JSON.stringify({version,seed,expected:hash,raw,canonical,match:raw===hash}));
          }
          JS
