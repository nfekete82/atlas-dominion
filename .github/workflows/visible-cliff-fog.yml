name: Visible sandstone cliff lighting regression
on:
  push:
    branches: [fix/rock-front-fog-lighting-20261027]
permissions:
  contents: read
jobs:
  fog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compile terrain rendering and run visibility and terrain tests
        run: |
          npm run build
          node --test tests/reborn-cliff-fog.test.mjs tests/reborn-map-ai.test.mjs tests/reborn-vision-cache.test.mjs
