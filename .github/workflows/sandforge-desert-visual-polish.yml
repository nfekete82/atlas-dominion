name: Sandforge desert art and production gates
on:
  push:
    branches:
      - feat/sandforge-desert-visual-polish-20261102
  pull_request:
    branches:
      - feat/sandforge-tank-balance-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  art-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Deterministic art, construction, vehicle tests
        run: node --test tests/sandforge-desert-visual-polish.test.mjs tests/sandforge-engineer-sequential-orders.test.mjs tests/sandforge-engineer-squad-escort.test.mjs tests/reborn-support.test.mjs
