name: Sandforge flank tempo regression spotchecks
on:
  push:
    branches: [test/sandforge-flank-tempo-regressions-20261103]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - opponent: pressure
            seed: 2026
          - opponent: armored
            seed: 2044
          - opponent: expansion
            seed: 2029
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Exact past decisive outcomes with real paid unit orders
        run: node scripts/ai-strategy-tournament.mjs --opponents "${{ matrix.opponent }}" --seeds "${{ matrix.seed }}" --seconds 360 --contenders current,early-barracks,threat-guard,flank-tempo --output ai-arena-results/flank-spot-${{ matrix.opponent }}-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flank-spot-${{ matrix.opponent }}-${{ matrix.seed }}
          path: ai-arena-results/flank-spot-${{ matrix.opponent }}-${{ matrix.seed }}.json
          retention-days: 21
