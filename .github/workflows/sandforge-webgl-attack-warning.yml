name: Sandforge WebGL attack warning

on:
  push:
    branches:
      - fix/webgl-attack-warning-minimap-20261108
  pull_request:
    branches:
      - fix/webgl-production-rally-wheel-stop-20261107
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warning-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/reborn-attack-alerts.test.mjs
      - name: Install Playwright browser dependencies
        run: |
          npm --prefix tests/browser ci --no-audit --no-fund
          cd tests/browser
          npx playwright install --with-deps chromium
      - name: Real Chromium attack warning, radio hook and minimap pixels
        env:
          CI: 'true'
          LIBGL_ALWAYS_SOFTWARE: '1'
          ATLAS_BROWSER_CHANNEL: chromium
        run: |
          set -euo pipefail
          PORT=8144 HOST=127.0.0.1 node scripts/serve.mjs >/tmp/sandforge-warning-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8144/healthz >/dev/null 2>&1; then break; fi
            sleep .25
          done
          ATLAS_BASE_URL=http://127.0.0.1:8144 \
            tests/browser/node_modules/.bin/playwright test \
            --config=tests/browser/playwright.config.mjs \
            tests/browser/webgl-attack-alerts.spec.mjs \
            --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sandforge-webgl-attack-warning-browser
          path: tests/browser/artifacts/
          if-no-files-found: ignore
          retention-days: 7
