name: Medic passive healing regression
on:
  push:
    branches: [feat/medic-passive-healing-aura-20261027]
permissions:
  contents: read
jobs:
  medic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build game and test medical support, combat and AI escorts
        run: |
          npm run build
          node --test tests/reborn-support.test.mjs tests/reborn-tactical-ai.test.mjs tests/reborn-ai-director.test.mjs tests/reborn-ai-pressure.test.mjs tests/front-combat.test.mjs
