name: Sandforge actual mission blocker census
on:
  push:
    branches: [diag/sandforge-assault-gate-census-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-ai-mission-gate-census.test.mjs tests/sandforge-ai-tournament.test.mjs tests/sandforge-four-bastion-postmortem.test.mjs tests/reborn-commander.test.mjs
  sample:
    needs: diagnostics-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        opponent: [guarded, pressure, expansion, armored]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Count each observed early-exit reason in paid equal-start games
        run: node scripts/ai-mission-gate-census.mjs --opponent "${{ matrix.opponent }}" --seeds 2026,2028,2029,2032,2058 --seconds 360 --output ai-arena-results/mission-gates-${{ matrix.opponent }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission-gates-${{ matrix.opponent }}
          path: ai-arena-results/mission-gates-${{ matrix.opponent }}.json
          retention-days: 21
