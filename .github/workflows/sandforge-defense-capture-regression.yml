name: Sandforge turret lock and capture regression
on:
  push:
    branches:
      - test/sandforge-turret-sector-capture-regression-20261102
permissions:
  contents: read
jobs:
  defense:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/reborn-defense-map.test.mjs tests/sandforge-legacy-adjacency.test.mjs
