name: Build PBR Sandforge rover and faction flags

on:
  push:
    branches: [feat/leopard-tank-flags-20261027, feat/rover-realistic-tires-flag-20261027]
    paths:
      - scripts/animation/humvee.js
      - scripts/animation/render.js
      - scripts/render-unit-atlases.mjs
      - src/reborn/transports.ts
      - src/reborn/catalog.ts
      - src/reborn/input.ts
      - src/reborn/main.ts
      - src/reborn/simulation.ts
      - tests/reborn-humvee.test.mjs
      - .github/workflows/humvee-rover.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: humvee-rover-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix tests/browser --no-audit --no-fund
          (cd tests/browser && npx playwright install --with-deps chromium)
      - name: Check model and renderer JavaScript
        run: |
          node --check scripts/animation/humvee.js
          node --check scripts/animation/render.js
          node --check scripts/render-unit-atlases.mjs
      - name: Generate faction Humvee GLBs and 192px tactical atlases
        env:
          ATLAS_BROWSER_CHANNEL: chromium
        run: node scripts/render-unit-atlases.mjs --hd --export-glb rover
      - name: Validate types and transport regression tests
        run: |
          npm run build
          node --test tests/reborn-humvee.test.mjs tests/reborn-combined-arms.test.mjs
      - name: Commit both GLBs and actual gameplay sprites
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for team in 0 1; do
            test -s "src/assets/reborn/animation/rover-$team.glb"
            test -s "src/assets/reborn/animation/rover-$team.png"
            test -s "src/assets/reborn/animation/rover-$team.json"
          done
          git add src/assets/reborn/animation/rover-0.glb src/assets/reborn/animation/rover-1.glb
          git add src/assets/reborn/animation/rover-0.png src/assets/reborn/animation/rover-1.png
          git add src/assets/reborn/animation/rover-0.json src/assets/reborn/animation/rover-1.json
          if git diff --cached --quiet; then
            echo "Both Humvee faction assets are already current."
            exit 0
          fi
          git commit -m "assets(rover): bake 4-seat Humvee GLBs and HD sprite atlases"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
