name: Sandforge selective raids held-out A/B
on:
  push:
    branches: [feat/sandforge-selective-raids-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-ai-tournament.test.mjs tests/reborn-combat-missions.test.mjs tests/reborn-commander.test.mjs tests/reborn-control-retreat.test.mjs
  ab:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        opponent: [pressure, expansion]
        cohort: [known, holdout]
        include:
          - cohort: known
            seeds: '2026,2027,2028,2029'
          - cohort: holdout
            seeds: '2030,2031,2032,2033'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Measure raid strategy with held-out four-bastion seeds
        run: node scripts/ai-strategy-tournament.mjs --opponents "${{ matrix.opponent }}" --seeds "${{ matrix.seeds }}" --seconds 360 --contenders current,no-side-raids,selective-raids,legacy-doctrine --output ai-arena-results/raids-${{ matrix.opponent }}-${{ matrix.cohort }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raids-${{ matrix.opponent }}-${{ matrix.cohort }}
          path: ai-arena-results/raids-${{ matrix.opponent }}-${{ matrix.cohort }}.json
          retention-days: 21
