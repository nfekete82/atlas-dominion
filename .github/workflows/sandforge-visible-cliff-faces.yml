name: Sandforge visible sandstone in fog
on:
  push:
    branches:
      - fix/sandforge-visible-cliff-faces-20261102
  pull_request:
    branches:
      - feat/sandforge-desert-visual-polish-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cliff-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-visible-cliff-faces.test.mjs tests/sandforge-desert-visual-polish.test.mjs
  cliff-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix tests/browser --no-audit --no-fund
      - run: cd tests/browser && npx playwright install --with-deps chromium
      - run: npm run build
      - name: Verify no terrain or enemy behind rock gets revealed
        env:
          ATLAS_BROWSER_CHANNEL: chromium
        run: cd tests/browser && npx playwright test --config=reborn.config.mjs reborn-visible-cliff-faces.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seen-sandstone-fog-proof
          path: |
            tests/browser/artifacts/reborn/visible-cliff-faces.png
            tests/browser/artifacts/reborn/visible-cliff-with-soldier.png
            tests/browser/artifacts/reborn-results.json
          if-no-files-found: ignore
          retention-days: 14
