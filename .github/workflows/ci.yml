name: Build and simulation tests

on:
  push:
    branches: [main, 'feat/sandforge-*', 'fix/sandforge-*']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  fingerprint-diagnostic:
    name: Legacy map snapshot diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Log raw and 6-decimal normalized map snapshots
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {Simulation} from './dist/src/reborn/simulation.js';
          const baselines=JSON.parse(readFileSync('tests/fixtures/reborn-legacy-maps.json','utf8'));
          for(const {version,seed,hash} of baselines){
            const g=new Simulation(seed,version);
            const geometry={generated:g.world.generated,blocked:Array.from(g.world.blocked),territories:g.territories,bases:g.bases,units:g.units.filter(u=>u.kind==='infantry')};
            const raw=createHash('sha256').update(JSON.stringify(geometry)).digest('hex');
            const rounded=JSON.stringify(geometry,(_,value)=>typeof value==='number'&&Number.isFinite(value)?Math.round(value*1_000_000)/1_000_000:value);
            const canonical=createHash('sha256').update(rounded).digest('hex');
            console.log('MAP_FINGERPRINT '+JSON.stringify({version,seed,expected:hash,raw,canonical,match:raw===hash}));
          }
          JS
  test:
    name: Node 22 · TypeScript and simulation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript build and full game test suite
        run: npm test
      - name: Validate real 3D building assets and animation atlases
        run: |
          npm run assets:buildings:validate
          npm run assets:animation-audit

  browser:
    name: Chromium · Reborn RTS gameplay
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install build and browser dependencies
        run: |
          npm install --no-audit --no-fund
          npm ci --prefix tests/browser --no-audit --no-fund
          cd tests/browser
          npx playwright install --with-deps chromium
      - name: RTS gameplay, controls, fog and persistent savegame
        env:
          ATLAS_BROWSER_CHANNEL: chromium
        run: npm run test:browser
      - name: Preserve screenshots, traces and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reborn-browser-evidence
          path: tests/browser/artifacts/
          retention-days: 14
