name: Sandforge legacy AI siege scenario tests
on:
  push:
    branches:
      - test/sandforge-legacy-ai-siege-scenarios-20261102
permissions:
  contents: read
jobs:
  tactical:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/reborn-tactical-ai.test.mjs tests/reborn-ai-pressure.test.mjs
