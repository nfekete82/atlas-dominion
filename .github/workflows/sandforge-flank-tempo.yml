name: Sandforge unsieged flank tempo A/B
on:
  push:
    branches: [feat/sandforge-open-flank-tempo-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-flank-tempo.test.mjs tests/sandforge-ai-tournament.test.mjs tests/sandforge-four-bastion-postmortem.test.mjs tests/reborn-combat-missions.test.mjs tests/reborn-commander.test.mjs
  league:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        opponent: [guarded, pressure, expansion, armored]
        cohort: [known, heldout, unseen]
        include:
          - cohort: known
            seeds: '2026,2027,2028,2029'
          - cohort: heldout
            seeds: '2046,2047,2048,2049'
          - cohort: unseen
            seeds: '2050,2051,2052,2053'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Identical playable starts and real paid four-way tournament
        run: node scripts/ai-strategy-tournament.mjs --opponents "${{ matrix.opponent }}" --seeds "${{ matrix.seeds }}" --seconds 360 --contenders current,early-barracks,threat-guard,flank-tempo --output ai-arena-results/flank-${{ matrix.opponent }}-${{ matrix.cohort }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flank-${{ matrix.opponent }}-${{ matrix.cohort }}
          path: ai-arena-results/flank-${{ matrix.opponent }}-${{ matrix.cohort }}.json
          retention-days: 21
