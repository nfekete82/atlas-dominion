name: Sandforge Tactical AI 2.5 - coordinated multi-front

on:
  push:
    branches:
      - feat/sandforge-tactical-ai-25-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tactical-25:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build paid RTS
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Targeted strategy / combat / fog / save tests
        run: |
          node --test \
            tests/reborn-tactical-ai-25.test.mjs \
            tests/reborn-tactical-ai-24.test.mjs \
            tests/reborn-tactical-ai-23.test.mjs \
            tests/reborn-tactical-ai-22.test.mjs \
            tests/reborn-commander.test.mjs \
            tests/reborn-ai-pressure.test.mjs \
            tests/reborn-combat-missions.test.mjs \
            tests/reborn-hold-fire.test.mjs
      - name: Paired deterministic battlefield comparison (2.4 vs 2.5)
        run: |
          node scripts/benchmark-tactical-ai-25.mjs \
            --maps 4,5 --seeds 2026 --seconds 420 \
            --opponents guarded,fortress \
            --output artifacts/tactical-ai-25-ab.json
      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-tactical-ai-25-ab
          path: artifacts/tactical-ai-25-ab.json
          if-no-files-found: ignore
          retention-days: 7
