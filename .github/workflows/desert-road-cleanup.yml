name: Desert road cleanup regression
on:
  push:
    branches: [fix/clean-desert-roads-no-props-20261026]
permissions:
  contents: read
jobs:
  roads:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and compile
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Test soft roads, no props, existing vehicle effects
        run: node --test tests/reborn-desert-cinematics.test.mjs tests/reborn-battlefield-atmosphere.test.mjs
