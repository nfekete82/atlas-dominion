name: Sandforge AI overmatch assault
on:
  push:
    branches:
      - feat/sandforge-ai-overmatch-assault-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  overmatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-ai-overmatch.test.mjs tests/reborn-ai-director.test.mjs
