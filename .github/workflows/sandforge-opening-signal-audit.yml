name: Sandforge paid opening trigger evidence
on:
  push:
    branches: [feat/sandforge-opening-evidence-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-opening-signal-audit.test.mjs tests/sandforge-ai-tournament.test.mjs
  sampled-opening:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        opponent: [guarded, pressure, expansion, armored]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Observe paid first 120 seconds (no simulation modifications)
        run: node scripts/ai-opening-signal-audit.mjs --opponent "${{ matrix.opponent }}" --seeds 2026,2029,2030,2038,2040 --output ai-arena-results/opening-${{ matrix.opponent }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opening-signal-${{ matrix.opponent }}
          path: ai-arena-results/opening-${{ matrix.opponent }}.json
          retention-days: 21
