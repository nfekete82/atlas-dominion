name: Sandforge complete Node simulation regression
on:
  push:
    branches:
      - test/sandforge-legacy-ai-siege-scenarios-20261102
permissions:
  contents: read
jobs:
  all-node:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
