name: Sandforge paid reinforcement join
on:
  push:
    branches:
      - fix/sandforge-reinforcements-join-front-20261102
permissions:
  contents: read
jobs:
  pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/reborn-ai-pressure.test.mjs
