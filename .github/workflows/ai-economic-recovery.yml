name: AI economic recovery regression
on:
  push:
    branches: [fix/ai-rebuild-after-squad-wipe-20261027]
permissions:
  contents: read
jobs:
  economic-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build and run economic, director, tactical, commander and production regressions
        run: |
          npm run build
          node --test tests/reborn-ai-director.test.mjs tests/reborn-ai-pressure.test.mjs tests/reborn-commander.test.mjs tests/reborn-tactical-ai.test.mjs tests/reborn-production.test.mjs
      - name: Exercise normal AI on 180 seconds of an actual campaign
        run: node scripts/benchmark-reborn-ai.mjs --maps 4 --seeds 2026 --seconds 180 --modes director --label recovery-fix --output /tmp/ai-recovery.json
