name: Sandforge strategic operation controller A/B
on:
  push:
    branches: [feat/sandforge-strategic-operation-controller-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-operation-controller.test.mjs tests/sandforge-ai-tournament.test.mjs tests/reborn-commander.test.mjs tests/reborn-combat-missions.test.mjs
  league:
    needs: regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        opponent: [guarded, pressure, expansion, armored]
        cohort: [known, heldout, new]
        include:
          - cohort: known
            seeds: '2026,2027,2028,2029'
          - cohort: heldout
            seeds: '2062,2063,2064,2065'
          - cohort: new
            seeds: '2066,2067,2068,2069'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: 360s paid fair full match, outcome and mission stability
        run: node scripts/ai-strategy-tournament.mjs --opponents "${{ matrix.opponent }}" --seeds "${{ matrix.seeds }}" --seconds 360 --contenders current,early-barracks,operation-controller --output ai-arena-results/operations-${{ matrix.opponent }}-${{ matrix.cohort }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operation-${{ matrix.opponent }}-${{ matrix.cohort }}
          path: ai-arena-results/operations-${{ matrix.opponent }}-${{ matrix.cohort }}.json
          retention-days: 21
