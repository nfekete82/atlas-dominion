name: Assemble Sandforge animated Bastion GLB (one-off)
on:
  push:
    branches: [feat/webgl-animated-bastion-reference-20261113]
    paths:
      - 'tools/bastion-glb-chunks/**'
      - '.github/workflows/sandforge-bastion-glb-assemble.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and reconstruct original animated GLB
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,readdirSync,writeFileSync,mkdirSync} from 'node:fs';
          import {join,dirname} from 'node:path';
          import {createHash} from 'node:crypto';
          const dir='tools/bastion-glb-chunks';
          const names=readdirSync(dir).filter(x=>/^part_\d{2}\.b64$/.test(x)).sort();
          if(names.length!==27)throw Error('Expected 27 GLB transfer parts, found '+names.length);
          const b64=names.map(x=>readFileSync(join(dir,x),'utf8').trim()).join('');
          const bytes=Buffer.from(b64,'base64');
          const sha256=createHash('sha256').update(bytes).digest('hex');
          const expected='9996713d27eadf4bbed6e49cc379089932667f1d594086258bf90554b1d2d340';
          if(sha256!==expected||bytes.length!==4053040)
            throw Error('Original GLB checksum/length mismatch '+sha256+'/'+bytes.length);
          const path='src/assets/reborn/buildings-3d/sandforge_bastion_animated.glb';
          mkdirSync(dirname(path),{recursive:true});
          writeFileSync(path,bytes);
          console.log('Verified original GLB:',path,bytes.length,'bytes SHA256:',sha256);
          NODE
      - name: Commit binary and remove one-off transport
        shell: bash
        run: |
          git config user.name "Sandforge Asset Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --quiet tools/bastion-glb-chunks
          git rm -f .github/workflows/sandforge-bastion-glb-assemble.yml
          git add src/assets/reborn/buildings-3d/sandforge_bastion_animated.glb
          git diff --cached --quiet || git commit -m "assets(webgl): install verified 4MB animated Bastion GLB"
          git push origin "HEAD:${GITHUB_REF_NAME}"
