name: Four bastion force concentration A/B
on:
  push:
    branches:
      - feat/sandforge-four-bastion-force-concentration-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-four-bastion-force-concentration.test.mjs tests/reborn-combat-missions.test.mjs tests/reborn-commander.test.mjs tests/sandforge-ai-frontline-learning.test.mjs
  pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/benchmark-four-bastion-concentration.mjs --seconds 240 --opponent pressure --seeds 2026,2027,2028,2029 --output ai-arena-results/compact-pressure.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-pressure-results
          path: ai-arena-results/compact-pressure.json
          if-no-files-found: ignore
  guarded:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/benchmark-four-bastion-concentration.mjs --seconds 240 --opponent guarded --seeds 2026,2027,2028,2029 --output ai-arena-results/compact-guarded.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-guarded-results
          path: ai-arena-results/compact-guarded.json
          if-no-files-found: ignore
