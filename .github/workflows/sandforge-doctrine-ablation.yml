name: Sandforge doctrine ablation tournament
on:
  push:
    branches: [feat/sandforge-ai-doctrine-ablation-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-ai-tournament.test.mjs tests/reborn-combat-missions.test.mjs tests/reborn-commander.test.mjs tests/reborn-control-retreat.test.mjs
  ablation:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        opponent: [pressure, expansion]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Six strategy mission / raid / siege ablation
        run: node scripts/ai-strategy-tournament.mjs --opponents "${{ matrix.opponent }}" --seeds 2026,2027,2028,2029 --seconds 360 --contenders current,legacy-doctrine,legacy-mission,no-side-raids,legacy-mission-no-raids,legacy-siege --output ai-arena-results/doctrine-${{ matrix.opponent }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctrine-${{ matrix.opponent }}
          path: ai-arena-results/doctrine-${{ matrix.opponent }}.json
          retention-days: 21
