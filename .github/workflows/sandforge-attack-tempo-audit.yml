name: Sandforge attack time accounting and root causes
on:
  push:
    branches: [diag/sandforge-assault-tempo-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-assault-tempo-audit.test.mjs tests/sandforge-flank-tempo.test.mjs tests/sandforge-ai-tournament.test.mjs
  profiles:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        opponent: [guarded, pressure, expansion, armored]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Read-only 1Hz first-contact, phase, siege and attack order audit
        run: node scripts/ai-assault-tempo-audit.mjs --opponent "${{ matrix.opponent }}" --seeds 2026,2029,2032,2051 --seconds 360 --output ai-arena-results/tempo-${{ matrix.opponent }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tempo-${{ matrix.opponent }}
          path: ai-arena-results/tempo-${{ matrix.opponent }}.json
          retention-days: 21
