name: Sandforge premium rock atlas and texture regression
on:
  push:
    branches: [feat/webgl-premium-sandstone-materials-20261108]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  stone-pbr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: |
          node --test tests/webgl-premium-stone-materials-20261108.test.mjs \
            tests/webgl-generals-combat-impacts-20261108.test.mjs
