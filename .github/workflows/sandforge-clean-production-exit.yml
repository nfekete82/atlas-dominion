name: Sandforge clean production exit
on:
  push:
    branches:
      - fix/sandforge-clean-production-exit-20261102
  pull_request:
    branches:
      - fix/sandforge-visible-cliff-faces-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-clean-production-exit.test.mjs tests/sandforge-desert-visual-polish.test.mjs tests/reborn-support.test.mjs tests/sandforge-engineer-sequential-orders.test.mjs
  production-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix tests/browser --no-audit --no-fund
      - run: cd tests/browser && npx playwright install --with-deps chromium
      - run: npm run build
      - name: Verify real unit emergence and untouched facade
        env:
          ATLAS_BROWSER_CHANNEL: chromium
        run: cd tests/browser && npx playwright test --config=reborn.config.mjs reborn-clean-production-exit.spec.mjs reborn-desert-visual-polish.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-production-egress-proof
          path: |
            tests/browser/artifacts/reborn/clean-production-exit.png
            tests/browser/artifacts/reborn/desert-visual-polish.png
            tests/browser/artifacts/reborn-results.json
          if-no-files-found: ignore
          retention-days: 14
