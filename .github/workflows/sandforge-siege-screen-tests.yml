name: Sandforge siege screen targeted tests
on:
  push:
    branches:
      - feat/sandforge-ai-limited-siege-screen-20261102
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-siege-limited-screen.test.mjs tests/reborn-tactical-ai-42-siege.test.mjs tests/reborn-tactical-ai-50-endgame.test.mjs tests/reborn-combat-missions.test.mjs tests/reborn-tactical-ai-43-recovery.test.mjs
