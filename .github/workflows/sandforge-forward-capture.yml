name: Sandforge forward capture mission tempo A/B
on:
  push:
    branches: [feat/sandforge-forward-capture-tempo-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-forward-capture.test.mjs tests/sandforge-ai-tournament.test.mjs tests/sandforge-four-bastion-postmortem.test.mjs tests/reborn-commander.test.mjs tests/reborn-combat-missions.test.mjs
  paid-pairs:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        opponent: [guarded, pressure, expansion, armored]
        cohort: [known, heldout, unseen]
        include:
          - cohort: known
            seeds: '2026,2027,2028,2029'
          - cohort: heldout
            seeds: '2030,2031,2032,2033'
          - cohort: unseen
            seeds: '2058,2059,2060,2061'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Real paid equal-state current vs early-barracks vs forward-capture
        run: node scripts/ai-strategy-tournament.mjs --opponents "${{ matrix.opponent }}" --seeds "${{ matrix.seeds }}" --seconds 360 --contenders current,early-barracks,forward-capture --output ai-arena-results/forward-${{ matrix.opponent }}-${{ matrix.cohort }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forward-${{ matrix.opponent }}-${{ matrix.cohort }}
          path: ai-arena-results/forward-${{ matrix.opponent }}-${{ matrix.cohort }}.json
          retention-days: 21
