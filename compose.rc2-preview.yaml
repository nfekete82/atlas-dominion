# RC2 preview ONLY. Never use compose.yaml / production port 8095 here.
# Start from the isolated RC2 checkout:
#   docker compose -p sandforge-rc2-preview -f compose.rc2-preview.yaml up --build -d
#   open http://127.0.0.1:8106/
# Stop:
#   docker compose -p sandforge-rc2-preview -f compose.rc2-preview.yaml down
services:
  sandforge-rc2-preview:
    build:
      context: .
      dockerfile: Dockerfile
    image: sandforge-webgl-rc2-preview:local
    restart: "no"
    ports:
      - "127.0.0.1:8106:8095"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8095/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
